<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventra - Book unforgettable events</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bordo:#6C151E;--green:#0F3D3A;--cream:#F5DABF;--bg:#FBF8F4;--ink:#1d2b2a;--muted:#6b7270;--line:#eadfd2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--green);margin:0}
header{background:var(--green);position:sticky;top:0;z-index:5}.bar{max-width:1120px;margin:auto;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.logo{font:700 1.5rem "Playfair Display",serif;color:var(--cream);text-decoration:none;margin-right:auto}
#links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#links a{color:var(--cream);text-decoration:none;padding:7px 12px;border-radius:10px;font-weight:500;opacity:.85;transition:.2s}#links a:hover{background:rgba(245,218,191,.14);opacity:1}
main{max-width:1120px;margin:auto;padding:28px 20px 60px;min-height:70vh}.page{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.btn{font:inherit;font-weight:600;background:var(--bordo);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .2s,transform .15s}.btn:hover{background:var(--green);transform:translateY(-1px)}.btn.s{background:var(--cream);color:var(--bordo)}.btn.s:hover{background:var(--bordo);color:#fff}.btn.sm{padding:7px 14px;font-size:.85rem}.btn:disabled{opacity:.4;pointer-events:none}
#links .btn{color:#fff;opacity:1}
.hero{background:linear-gradient(120deg,var(--green),#17504b);border-radius:26px;padding:clamp(28px,6vw,64px);color:var(--cream);margin-bottom:34px}.hero h1{color:var(--cream);font-size:clamp(2rem,5vw,3.2rem);max-width:640px}.hero p{max-width:520px;opacity:.85;margin:14px 0 24px}
h2{font-size:1.6rem;margin:30px 0 16px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--cream);color:var(--bordo);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.85rem;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(15,61,58,.07);overflow:hidden;transition:transform .2s,box-shadow .2s}.ev:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,61,58,.13)}
.cover{height:130px;display:flex;align-items:flex-end;padding:12px 16px;color:rgba(245,218,191,.9);font:700 2.6rem "Playfair Display",serif;position:relative}.cover .pill{position:absolute;top:12px;right:12px}
.evb{padding:16px 18px 18px}.evb h3{font-size:1.1rem;margin-bottom:6px}.m{margin:2px 0;color:var(--muted);font-size:.88rem}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.pill{padding:3px 11px;border-radius:99px;font-size:.75rem;font-weight:600;display:inline-block}.gr{background:#dcebe8;color:var(--green)}.bd{background:#f3d9dc;color:var(--bordo)}.cr{background:var(--cream);color:var(--bordo)}.mu{background:#ece8e3;color:#6b7270}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}input,select,textarea{font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid var(--green)}.tools input{flex:1;min-width:200px}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 28px rgba(15,61,58,.07);max-width:460px;margin:20px auto}.panel.wide{max-width:none;margin:0}
form.f{display:grid;gap:14px}.f label{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}.f input,.f select{width:100%}.err{color:var(--bordo);font-size:.9rem;min-height:1.2em}
.detail{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}.detail .cover{height:240px;border-radius:20px}
.item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;padding:18px;margin-bottom:14px}.item h3{font-size:1.1rem}.id{font-family:ui-monospace,monospace;color:var(--bordo);font-weight:600;font-size:.85rem}.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;padding:50px 16px;color:var(--muted)}.empty b{display:block;color:var(--green);font:600 1.2rem "Playfair Display",serif;margin-bottom:6px}
.sk{height:200px;border-radius:18px;background:linear-gradient(90deg,#efe8df,#f8f3ec,#efe8df);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
dialog{border:0;border-radius:22px;padding:26px;width:min(440px,94vw);box-shadow:0 30px 80px rgba(15,61,58,.3)}dialog::backdrop{background:rgba(15,61,58,.55)}dialog h3{margin-bottom:12px;font-size:1.4rem}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:.92rem}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}.dact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.note{padding:12px 0;border-bottom:1px solid var(--line)}.note:last-child{border:0}
footer{background:var(--green);color:var(--cream);text-align:center;padding:22px;font-size:.88rem;opacity:.95}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:99px;color:#fff;font-weight:600;display:none;z-index:99}#toast.ok{background:var(--green)}#toast.err{background:var(--bordo)}
@media(max-width:760px){.detail{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#/">Eventra</a><nav id="links"></nav></div></header>
<main id="app"></main>
<footer>Eventra, college project demo. Payments on this site are simulated and no real money is collected.</footer>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),KEY='eventraToken',tk=()=>localStorage.getItem(KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>n?'₹'+Number(n).toLocaleString('en-IN'):'Free';
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
const today=new Date().toLocaleDateString('en-CA');
let ME=null,EV=[];
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:{...(b?{'Content-Type':'application/json'}:{}),...(tk()?{Authorization:'Bearer '+tk()}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401&&tk()&&u!=='/api/auth/login'){localStorage.removeItem(KEY);ME=null;nav()}if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
let tt;const toast=(m,ok=true)=>{const t=$('#toast');t.textContent=m;t.className=ok?'ok':'err';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)};
const safe=fn=>async(...a)=>{try{await fn(...a)}catch(e){toast(e.message,false)}};
const bg=['linear-gradient(135deg,#6C151E,#0F3D3A)','linear-gradient(135deg,#0F3D3A,#6C151E)','linear-gradient(135deg,#8a3a40,#F5DABF)','linear-gradient(135deg,#0F3D3A,#4d7f7a)'];
const cover=(e,extra='')=>`<div class="cover" style="background:${e.image?`url('${esc(e.image)}') center/cover`:bg[[...(e.category||e.name)].reduce((a,c)=>a+c.charCodeAt(0),0)%4]}">${e.image?'':esc((e.category||e.name).slice(0,2))}${extra}</div>`;
const state=e=>e.date<today?['Completed','mu']:e.available<=0?['Sold out','bd']:[e.available+' left','gr'];
const card=e=>{const[s,c]=state(e);return `<article class="card ev"><a href="#/event/${esc(e.id)}" style="text-decoration:none;color:inherit">${cover(e,`<span class="pill ${c}">${s}</span>`)}<div class="evb"><h3>${esc(e.name)}</h3><p class="m">${fmt(e.date)}</p><p class="m">${esc(e.location||e.venue)}</p><div class="row"><b>${inr(e.price)}</b><span class="m">${esc(e.category)}</span></div></div></a></article>`};
const empty=(t,m)=>`<div class="empty"><b>${t}</b>${m}</div>`;
const skel=()=>`<div class="grid">${'<div class="sk"></div>'.repeat(3)}</div>`;
const dlg=$('#dlg');dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
const open=h=>{dlg.innerHTML=h;if(!dlg.open)dlg.showModal()};

function nav(){const l=[['#/','Home'],['#/events','Events'],['#/about','About'],['#/contact','Contact']];
 $('#links').innerHTML=l.map(([h,t])=>`<a href="${h}">${t}</a>`).join('')+(ME?`<a href="#/bookings">My bookings</a><a href="#/profile">Profile</a>${ME.role==='admin'?'<a href="/admin">Admin panel</a>':''}<a class="btn sm" href="#/" id="lo">Log out</a>`:`<a href="#/login">Log in</a><a class="btn sm" href="#/register">Sign up</a>`);
 const lo=$('#lo');if(lo)lo.onclick=()=>{localStorage.removeItem(KEY);ME=null;nav();toast('Logged out')}}
const loadEvents=async()=>{EV=await api('/api/events')};
const up=()=>EV.filter(e=>e.date>=today);
const need=()=>{if(ME)return false;toast('Please log in first',false);location.hash='#/login';return true};

const pages={
async home(){await loadEvents();const cats=await api('/api/categories');const f=up().filter(e=>e.available>0).slice(0,3);
 return `<section class="hero"><h1>Find and book events you will remember</h1><p>Weddings, concerts, conferences and college fests across India, all in one place.</p><a class="btn s" href="#/events">Browse events</a></section>
 <h2>Upcoming events</h2>${f.length?`<div class="grid">${f.map(card).join('')}</div>`:empty('No upcoming events','Check back soon.')}
 <h2>Categories</h2><div class="chips">${cats.map(c=>`<a class="chip" href="#/events?c=${encodeURIComponent(c.name)}">${esc(c.name)}</a>`).join('')}</div>`},
async events(q){await loadEvents();const cats=[...new Set(EV.map(e=>e.category).filter(Boolean))];const pre=new URLSearchParams(q).get('c')||'';
 setTimeout(()=>{const draw=()=>{const s=$('#q').value.toLowerCase(),c=$('#c').value,o=$('#o').value;let l=up().filter(e=>(!s||(e.name+e.location+e.venue).toLowerCase().includes(s))&&(!c||e.category===c));l.sort((a,b)=>o==='price'?a.price-b.price:a.date.localeCompare(b.date));$('#list').innerHTML=l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty('No events found','Try a different search or category.')};['q','c','o'].forEach(i=>$('#'+i).addEventListener('input',draw));draw()});
 return `<h1>Browse events</h1><div class="tools" style="margin-top:16px"><input id="q" placeholder="Search by name or city" aria-label="Search"><select id="c"><option value="">All categories</option>${cats.map(c=>`<option${c===pre?' selected':''}>${esc(c)}</option>`).join('')}</select><select id="o"><option value="date">Soonest first</option><option value="price">Lowest price</option></select></div><div id="list"></div>`},
async event(id){await loadEvents();const e=EV.find(x=>x.id===id);if(!e)return empty('Event not found','It may have been removed.');
 const[s,c]=state(e),can=e.date>=today&&e.available>0,max=Math.min(10,e.available);
 setTimeout(()=>{const t=$('#tk');if(t){const u=()=>$('#tot').textContent=inr(t.value*e.price);t.oninput=u;u()}});
 return `<a href="#/events" class="m">&larr; All events</a><div class="detail" style="margin-top:14px"><div>${cover(e,`<span class="pill ${c}">${s}</span>`)}<h1 style="margin:20px 0 8px">${esc(e.name)}</h1><p class="m">${esc(e.category)}</p><p>${esc(e.description)||'Details coming soon.'}</p>
 <dl class="kv"><dt>Date</dt><dd>${fmt(e.date)}</dd><dt>Time</dt><dd>${esc(e.startTime)||'-'} to ${esc(e.endTime)||'-'}</dd><dt>Venue</dt><dd>${esc(e.venue)}</dd><dt>Location</dt><dd>${esc(e.location)||'-'}</dd><dt>Seats left</dt><dd>${e.available} of ${e.cap}</dd></dl></div>
 <div class="panel" style="margin:0"><h3>${inr(e.price)} <small class="m">per ticket</small></h3>${can?`<form class="f" style="margin-top:14px" id="bk" data-id="${esc(e.id)}"><label>Tickets<select id="tk">${Array.from({length:max},(_,i)=>`<option>${i+1}</option>`).join('')}</select></label><p>Total: <b id="tot"></b></p><button class="btn">${ME?'Book now':'Log in to book'}</button></form>`:`<p class="m" style="margin-top:12px">${e.date<today?'This event has finished.':'This event is sold out.'}</p>`}</div></div>`},
about:()=>`<div class="panel wide"><h1>About Eventra</h1><p>Eventra helps organisers run weddings, concerts, conferences and college fests, and helps guests discover and book them in a few taps.</p><p>This is a college project built with Node.js, Express and MongoDB. Payments are simulated for demonstration.</p></div>`,
contact:()=>`<div class="panel wide"><h1>Contact us</h1><p>Questions about an event or a booking? Write to us and mention your booking ID.</p><p><a class="btn" href="mailto:support@eventpro.com">Email support@eventpro.com</a></p></div>`,
login:()=>`<div class="panel"><h1>Welcome back</h1><form class="f" style="margin-top:16px" id="login"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><p class="err"></p><button class="btn">Log in</button></form><p class="m">New here? <a href="#/register">Create an account</a></p><p class="m">Demo customer (development only): customer@gmail.com / Customer@123</p></div>`,
register:()=>`<div class="panel"><h1>Create your account</h1><form class="f" style="margin-top:16px" id="register"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone"></label><label>Password<input name="password" type="password" minlength="8" required></label><p class="m">8+ characters with letters and numbers.</p><p class="err"></p><button class="btn">Sign up</button></form></div>`,
async bookings(){if(!ME)return empty('Please log in','<a href="#/login">Log in</a> to see your bookings.');const l=await api('/api/bookings');
 return `<h1>My bookings</h1><p class="m">Cancel up to 2 days before the event. Payments are simulated.</p><div style="margin-top:16px">${l.length?l.map(b=>`<div class="card item"><div><h3>${esc(b.event)}</h3><p class="m">${fmt(b.eventDate)} · ${esc(b.venue)}</p><p class="m">${b.tickets} ticket(s) · ${inr(b.amount)} · <span class="id">${esc(b.bookingId)}</span></p></div><div class="acts"><span class="pill ${b.bookingStatus==='Confirmed'||b.bookingStatus==='Completed'?'gr':b.bookingStatus==='Pending'?'cr':'bd'}">${esc(b.bookingStatus)}</span><span class="pill ${b.paymentStatus==='Paid'?'gr':b.paymentStatus==='Pending'?'cr':'bd'}">Payment: ${esc(b.paymentStatus)}</span>${b.paymentStatus==='Pending'&&b.bookingStatus!=='Cancelled'?`<button class="btn sm" data-pay="${esc(b.id)}" data-amt="${b.amount}" data-code="${esc(b.bookingId)}">Pay now</button>`:''}${b.cancellable?`<button class="btn sm s" data-cancel="${esc(b.id)}">Cancel</button>`:''}</div></div>`).join(''):empty('No bookings yet','Find an event on the <a href="#/events">events page</a>.')}</div>`},
async profile(){if(!ME)return empty('Please log in','<a href="#/login">Log in</a> to see your profile.');const n=await api('/api/notifications');
 return `<h1>My profile</h1><div class="detail" style="margin-top:16px"><div class="panel wide"><form class="f" id="profile"><label>Name<input name="name" value="${esc(ME.name)}" required></label><label>Email<input value="${esc(ME.email)}" disabled></label><label>Phone<input name="phone" value="${esc(ME.phone)}"></label><label>Current password (only to change it)<input name="currentPassword" type="password"></label><label>New password<input name="newPassword" type="password"></label><p class="err"></p><button class="btn">Save changes</button></form></div>
 <div class="panel wide"><h3>Notifications</h3>${n.length?n.map(x=>`<div class="note"><b>${esc(x.title)}</b><p class="m">${esc(x.message)}</p></div>`).join(''):'<p class="m">Nothing yet.</p>'}</div></div>`}
};

async function route(){const [path,...r]=(location.hash.slice(2)||'').split('/');const[name,qs]=[path.split('?')[0],path.split('?')[1]||''];
 const key=name||'home',fn=pages[key]||pages.home;$('#app').innerHTML=skel();
 try{const arg=key==='event'?r[0]:key==='events'?qs:undefined;$('#app').innerHTML=`<div class="page">${await fn(arg)}</div>`}catch(e){$('#app').innerHTML=empty('Something went wrong',esc(e.message))}window.scrollTo(0,0)}

function payDlg(id,amt,code){open(`<h3>Pay for ${esc(code)}</h3><p class="m">Demo payment. No real money is collected.</p><form class="f" id="payf" data-id="${esc(id)}"><label>Method<select name="method"><option>UPI</option><option>Card</option><option>NetBanking</option></select></label><p><b>Amount: ${inr(amt)}</b></p><div class="dact"><button type="button" class="btn s" id="later">Pay later</button><button class="btn">Pay now</button></div></form>`);$('#later').onclick=()=>{dlg.close();location.hash='#/bookings'}}
function doneDlg(b){open(`<h3>${b.paymentStatus==='Paid'?'Booking confirmed':'Booking received'}</h3><dl class="kv"><dt>Booking ID</dt><dd class="id">${esc(b.bookingId)}</dd><dt>Event</dt><dd>${esc(b.event)}</dd><dt>Date</dt><dd>${fmt(b.eventDate)}</dd><dt>Tickets</dt><dd>${b.tickets}</dd><dt>Total</dt><dd>${inr(b.amount)}</dd><dt>Status</dt><dd>${esc(b.bookingStatus)}</dd></dl><div class="dact"><button class="btn" id="ok">View my bookings</button></div>`);$('#ok').onclick=()=>{dlg.close();location.hash='#/bookings'}}

document.addEventListener('submit',safe(async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),err=f.querySelector('.err');if(err)err.textContent='';
 try{
 if(f.id==='login'||f.id==='register'){const r=await api('/api/auth/'+f.id,'POST',d);localStorage.setItem(KEY,r.token);ME=r.user;nav();toast(f.id==='login'?'Welcome back':'Account created');if(r.user.role==='admin')location.href='/admin';else location.hash='#/events'}
 else if(f.id==='bk'){if(need())return;const b=await api('/api/bookings','POST',{eventId:f.dataset.id,tickets:+$('#tk').value});b.paymentStatus==='Pending'?payDlg(b.id,b.amount,b.bookingId):doneDlg(b);await loadEvents()}
 else if(f.id==='payf'){const b=await api(`/api/bookings/${f.dataset.id}/pay`,'POST',d);doneDlg(b)}
 else if(f.id==='profile'){ME=await api('/api/auth/me','PUT',d);toast('Profile saved');route()}
 }catch(x){if(err)err.textContent=x.message;else throw x}}));
document.addEventListener('click',safe(async e=>{const p=e.target.closest('[data-pay]'),c=e.target.closest('[data-cancel]');
 if(p)payDlg(p.dataset.pay,p.dataset.amt,p.dataset.code);
 if(c&&confirm('Cancel this booking?')){await api(`/api/bookings/${c.dataset.cancel}/cancel`,'POST');toast('Booking cancelled');route()}}));
window.addEventListener('hashchange',route);
(async()=>{if(tk()){try{ME=await api('/api/auth/me')}catch{}}nav();route()})();
</script>
</body>
</html>
